services:
  backend:
    build:
      context: ./backend
    container_name: poker-backend
    ports:
      - "5000:5000"
    volumes:
      - backend-data:/app/instance
    environment:
      - FLASK_APP=main.py
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000

  frontend:
    build:
      context: ./frontend
    container_name: poker-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend-data: